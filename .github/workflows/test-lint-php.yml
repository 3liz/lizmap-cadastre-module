name: Lint PHP 🚨

on:
  push:
    paths:
      - '**.php'
  pull_request:
    paths:
      - '**.php'

jobs:
  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: PHP-CS-Fixer
      # Same version as Lizmap Web Client, it must match the one from the Makefile
      uses: docker://ghcr.io/php-cs-fixer/php-cs-fixer:3.69-php8.1
      with:
        args: check --allow-risky=yes --diff
